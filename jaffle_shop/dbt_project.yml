name: jaffle_shop

profile: jaffle_shop

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"


snapshots:
  jaffle_shop:
    +database: analytics
    +schema: snapshots
    +hard_deletes: ignore
    +dbt_valid_to_current: "to_date('9999-12-31')"

models:
  jaffle_shop:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      finance:
        +schema: finance
    
      marketing:
        +schema: marketing


