models:
  - name: stg_jaffle_shop__customers
    columns:
      - name: customer_id
        description: primary key
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    columns:
    - name: order_id
      description: primary key
      data_tests:
        - unique 
        - not_null

    - name: status
      description: "{{ doc('order_status') }}"
      data_tests:
        - accepted_values: 
            arguments: 
              values: ['returned','completed','return_pending','shipped','placed']
    - name: customer_id
      description: the identifier for the customer who is responsible for the order
      data_tests:
       - relationships:
          arguments:
            to: ref('stg_jaffle_shop__customers')
            field: customer_id